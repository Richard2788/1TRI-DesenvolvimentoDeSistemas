<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrinho - Ross Cars</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="mycss.css" rel="stylesheet">
</head>
<body class="container py-4">
  <nav class="mb-4"><a href="carros.html">Continuar comprando</a> · <a href="compras.html">Minhas compras</a></nav>
  <h1>Carrinho de compras</h1>
  <div id="itens" class="my-4"></div>
  <p id="total" class="fw-bold"></p>
  <div class="mb-3">
    <label for="pagamento" class="form-label">Forma de pagamento</label>
    <select id="pagamento" class="form-select" style="max-width:320px">
      <option value="">Selecione</option><option value="PIX">PIX</option>
      <option value="Cartão de crédito">Cartão de crédito</option>
      <option value="Financiamento">Financiamento</option>
      <option value="À vista">À vista</option>
    </select>
  </div>
  <button id="finalizar" class="btn btn-primary">Finalizar compra</button>
  <p id="mensagem" class="mt-3" role="status"></p>
  <script src="config.js"></script><script src="pages.js"></script>
  <script>
    const lista = document.getElementById("itens");
    const totalEl = document.getElementById("total");
    const mensagem = document.getElementById("mensagem");
    const dinheiro = valor => Number(valor).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
    function renderizar() {
      const carrinho = obterCarrinho();
      lista.replaceChildren();
      if (!carrinho.length) lista.textContent = "Seu carrinho está vazio.";
      carrinho.forEach((item, indice) => {
        const linha = document.createElement("div");
        linha.className = "d-flex justify-content-between align-items-center border-bottom py-3 gap-3";
        const descricao = document.createElement("span");
        descricao.textContent = item.nome + " — " + dinheiro(item.preco);
        const remover = document.createElement("button");
        remover.className = "btn btn-outline-danger btn-sm";
        remover.textContent = "Remover";
        remover.onclick = () => {
          const atual = obterCarrinho(); atual.splice(indice,1);
          localStorage.setItem("carrinho_compras",JSON.stringify(atual)); renderizar();
        };
        linha.append(descricao,remover); lista.append(linha);
      });
      totalEl.textContent = "Subtotal: " + dinheiro(carrinho.reduce((s,i)=>s+Number(i.preco||0),0));
      document.getElementById("finalizar").disabled = !carrinho.length;
    }
    document.getElementById("finalizar").addEventListener("click", async () => {
      const token = localStorage.getItem("token");
      const itens = obterCarrinho();
      const formaPagamento = document.getElementById("pagamento").value;
      mensagem.textContent = "";
      if (!token) { mensagem.textContent = "Entre na sua conta para finalizar a compra."; return; }
      if (!formaPagamento) { mensagem.textContent = "Selecione a forma de pagamento."; return; }
      const botao = document.getElementById("finalizar"); botao.disabled = true;
      try {
        const resposta = await fetch((window.link_api || location.origin) + "/compras", {
          method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
          body:JSON.stringify({itens:itens.map(i=>({idCarro:i.idCarro})),formaPagamento})
        });
        const dados = await resposta.json();
        if (!resposta.ok) throw new Error(dados.erro || "Falha ao finalizar.");
        localStorage.removeItem("carrinho_compras");
        mensagem.textContent = "Compra #"+dados.idCompra+" realizada! Total: "+dinheiro(dados.totalCompra);
        renderizar();
      } catch (erro) { mensagem.textContent = erro.message; }
      finally { botao.disabled = obterCarrinho().length === 0; }
    });
    renderizar();
  </script>
</body></html>
